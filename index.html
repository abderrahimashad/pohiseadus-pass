<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Põhiseadus Pass — Eesti Kodakondsuse & Keele Eksam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const QUESTIONS = [
      {
        id: 1, topic: "general", ref: "Põhiseadus § 1",
        q: { et: "Kelle käes on Eesti Vabariigis kõrgeim riigivõim?", en: "Who holds the supreme power of state in Estonia?", ru: "Кому принадлежит высшая государственная власть в Эстонии?" },
        options: {
          et: ["Vabariigi Presidendil", "Rahval", "Riigikogul"],
          en: ["The President", "The People (Rahvas)", "The Parliament (Riigikogu)"],
          ru: ["Президенту", "Народу (Rahvas)", "Парламенту (Riigikogu)"]
        },
        correct: 1,
        exp: { et: "Kõrgeima riigivõimu kandja on rahvas (§ 1).", en: "Supreme power is vested in the people (§ 1).", ru: "Носителем высшей гос. власти является народ (§ 1)." }
      },
      {
        id: 2, topic: "general", ref: "Põhiseadus § 6",
        q: { et: "Mis on Eesti Vabariigi riigikeel?", en: "What is the official state language of Estonia?", ru: "Какой язык является государственным в Эстонии?" },
        options: {
          et: ["Eesti ja inglise keel", "Eesti keel", "Eesti ja vene keel"],
          en: ["Estonian and English", "Estonian (Eesti keel)", "Estonian and Russian"],
          ru: ["Эстонский и английский", "Эстонский язык (Eesti keel)", "Эстонский и русский"]
        },
        correct: 1,
        exp: { et: "Eesti riigikeel on eesti keel (§ 6).", en: "The official language is Estonian (§ 6).", ru: "Государственным языком является эстонский (§ 6)." }
      },
      {
        id: 3, topic: "rights", ref: "Põhiseadus § 20",
        q: { et: "Kui kaua võib isikut kinni pidada ilma kohtu loata?", en: "How long can a person be detained without a court warrant?", ru: "На какой срок можно задержать без санкции суда?" },
        options: {
          et: ["Kuni 24 tundi", "Kuni 48 tundi", "Kuni 72 tundi"],
          en: ["Up to 24 hours", "Up to 48 hours", "Up to 72 hours"],
          ru: ["До 24 часов", "До 48 часов", "До 72 часов"]
        },
        correct: 1,
        exp: { et: "Ilma kohtu loata kuni 48 tundi (§ 20).", en: "Up to 48 hours without a warrant (§ 20).", ru: "Без санкции суда — до 48 часов (§ 20)." }
      },
      {
        id: 4, topic: "riigikogu", ref: "Põhiseadus § 60",
        q: { et: "Mitu liiget on Riigikogul ja kui kauaks nad valitakse?", en: "How many members does Riigikogu have and for how long?", ru: "Сколько депутатов в Рийгикогу и на какой срок?" },
        options: {
          et: ["101 liiget, 4 aastaks", "100 liiget, 5 aastaks", "120 liiget, 4 aastaks"],
          en: ["101 members, 4 years", "100 members, 5 years", "120 members, 4 years"],
          ru: ["101 депутат на 4 года", "100 депутатов на 5 лет", "120 депутатов на 4 года"]
        },
        correct: 0,
        exp: { et: "Riigikogul on 101 liiget, 4 aastat (§ 60).", en: "101 members elected for 4 years (§ 60).", ru: "101 депутат, избираемый на 4 года (§ 60)." }
      },
      {
        id: 5, topic: "president", ref: "Põhiseadus § 79",
        q: { et: "Mis on Vabariigi Presidendi kandidaadi vanuse alampiir?", en: "What is the minimum age for a Presidential candidate?", ru: "Каков минимальный возраст кандидата в Президенты?" },
        options: {
          et: ["Vähemalt 35 aastat", "Vähemalt 40 aastat", "Vähemalt 45 aastat"],
          en: ["At least 35 years", "At least 40 years", "At least 45 years"],
          ru: ["Не менее 35 лет", "Не менее 40 лет", "Не менее 45 лет"]
        },
        correct: 1,
        exp: { et: "Vähemalt 40-aastane sünnilt Eesti kodanik (§ 79).", en: "At least 40 years old, citizen by birth (§ 79).", ru: "Не менее 40 лет, гражданин по рождению (§ 79)." }
      },
      {
        id: 6, topic: "citizenship", ref: "Kodakondsuse seadus § 6",
        q: { et: "Kui kaua peab välismaalane elama Eestis enne kodakondsuse taotlemist?", en: "How long must a foreigner live in Estonia before applying for citizenship?", ru: "Сколько лет иностранец должен прожить в Эстонии перед подачей на гражданство?" },
        options: {
          et: ["Vähemalt 5 aastat", "Vähemalt 8 aastat püsivalt", "Vähemalt 10 aastat"],
          en: ["At least 5 years", "At least 8 years permanently", "At least 10 years"],
          ru: ["Не менее 5 лет", "Не менее 8 лет постоянно", "Не менее 10 лет"]
        },
        correct: 1,
        exp: { et: "Vähemalt 8 aastat, viimased 5 aastat püsivalt (KS § 6).", en: "At least 8 years, last 5 permanently (Citizenship Act § 6).", ru: "Не менее 8 лет, последние 5 постоянно (§ 6 Закона о гражданстве)." }
      }
    ];

    function App() {
      const [lang, setLang] = useState("en");
      const [tab, setTab] = useState("home");
      const [isPro, setIsPro] = useState(false);
      const [showPayModal, setShowPayModal] = useState(false);
      const [selectedPlan, setSelectedPlan] = useState("full");
      const [qIdx, setQIdx] = useState(0);
      const [picked, setPicked] = useState(null);
      const [score, setScore] = useState(0);
      const [isFinished, setIsFinished] = useState(false);

      const curQ = QUESTIONS[qIdx];

      const handleNext = () => {
        if (qIdx < QUESTIONS.length - 1) {
          setQIdx(qIdx + 1);
          setPicked(null);
        } else {
          setIsFinished(true);
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          <div className="h-1.5 w-full flex">
            <div className="flex-1 bg-[#0072CE]"></div>
            <div className="flex-1 bg-slate-900"></div>
            <div className="flex-1 bg-white border-b border-slate-200"></div>
          </div>

          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div onClick={() => { setTab("home"); setIsFinished(false); }} className="flex items-center gap-2.5 cursor-pointer">
                <div className="w-9 h-9 rounded-lg bg-[#0072CE] text-white font-extrabold flex items-center justify-center">EE</div>
                <div>
                  <span className="font-extrabold text-lg text-slate-900">Põhiseadus</span>
                  <span className="font-extrabold text-lg text-[#0072CE]">Pass</span>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="flex bg-slate-100 p-1 rounded-lg border">
                  {["et", "en", "ru"].map((l) => (
                    <button key={l} onClick={() => setLang(l)} className={`px-2.5 py-1 rounded text-xs font-bold uppercase ${lang === l ? "bg-white text-[#0072CE] shadow" : "text-slate-600"}`}>{l}</button>
                  ))}
                </div>
                <button onClick={() => { setSelectedPlan("full"); setShowPayModal(true); }} className={`px-4 py-2 rounded-lg text-xs font-bold ${isPro ? "bg-emerald-100 text-emerald-800" : "bg-[#0072CE] text-white"}`}>
                  {isPro ? "✓ PRO ACTIVE" : "GET PRO · 25.99 €"}
                </button>
              </div>
            </div>
          </header>

          {tab === "home" && !isFinished && (
            <main className="flex-1 max-w-6xl mx-auto px-4 py-16 text-center space-y-6">
              <span className="px-3 py-1 rounded-full bg-blue-50 text-[#0072CE] text-xs font-bold border border-blue-200">🇪🇪 Official HARNO 2026 Prep</span>
              <h1 className="text-4xl md:text-6xl font-extrabold text-slate-900 max-w-3xl mx-auto">Pass the Estonian Constitution Exam on Your First Try</h1>
              <p className="text-lg text-slate-600 max-w-2xl mx-auto">All official questions, explanations in 3 languages, and full mock exams.</p>
              <div className="flex justify-center gap-4 pt-4">
                <button onClick={() => setTab("practice")} className="px-8 py-4 rounded-xl bg-[#0072CE] text-white font-bold shadow-lg hover:bg-blue-700">Start Practice →</button>
              </div>
            </main>
          )}

          {tab === "practice" && !isFinished && (
            <main className="flex-1 max-w-3xl mx-auto w-full px-4 py-10 space-y-6">
              <div className="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                <div className="flex justify-between items-center text-xs font-bold text-[#0072CE]">
                  <span>{curQ.ref}</span>
                  <span>Question {qIdx + 1} / {QUESTIONS.length}</span>
                </div>
                <h3 className="text-xl font-extrabold text-slate-900">{curQ.q[lang] || curQ.q.et}</h3>
                <div className="space-y-3">
                  {curQ.options[lang] ? curQ.options[lang].map((opt, idx) => {
                    let st = "border-slate-200 bg-slate-50";
                    if (picked !== null) {
                      if (idx === curQ.correct) st = "border-emerald-500 bg-emerald-50 text-emerald-900";
                      else if (picked === idx) st = "border-rose-400 bg-rose-50 text-rose-900";
                    }
                    return (
                      <button key={idx} onClick={() => { if(picked === null) { setPicked(idx); if(idx === curQ.correct) setScore(s=>s+1); } }} className={`w-full text-left p-4 rounded-xl border-2 font-semibold transition ${st}`}>
                        {opt}
                      </button>
                    );
                  }) : null}
                </div>
                {picked !== null && (
                  <div className="p-4 rounded-xl bg-blue-50 border border-blue-200 text-sm space-y-1">
                    <div className="font-bold text-[#0072CE]">Explanation:</div>
                    <p className="text-slate-700">{curQ.exp[lang] || curQ.exp.et}</p>
                  </div>
                )}
                <div className="flex justify-end pt-4 border-t">
                  <button onClick={handleNext} className="px-6 py-2 bg-slate-900 text-white rounded-lg text-sm font-bold hover:bg-slate-800">
                    {qIdx === QUESTIONS.length - 1 ? "Finish Test 🏁" : "Next →"}
                  </button>
                </div>
              </div>
            </main>
          )}

          {isFinished && (
            <main className="flex-1 max-w-xl mx-auto w-full px-4 py-10 text-center space-y-6">
              <div className="bg-white p-6 rounded-2xl border shadow-xl space-y-4">
                <div className="text-3xl">🎉</div>
                <h2 className="text-xl font-extrabold text-slate-900">Test Completed! Score: {score} / {QUESTIONS.length}</h2>
                
                {/* Dual Pricing / Packs Section */}
                <div className="grid grid-cols-2 gap-3 text-left">
                  <div className="p-4 rounded-xl border-2 border-slate-200 bg-slate-50 flex flex-col justify-between space-y-3">
                    <div className="space-y-1">
                      <div className="font-extrabold text-sm text-slate-900">Basic Pass</div>
                      <div className="text-xl font-extrabold text-[#0072CE]">9.99 €</div>
                      <p className="text-[11px] text-slate-600">All Constitution questions & mock exams.</p>
                    </div>
                    <button onClick={() => { setSelectedPlan("basic"); setShowPayModal(true); }} className="w-full py-2 bg-slate-900 text-white text-xs font-bold rounded-lg">Get Basic</button>
                  </div>

                  <div className="p-4 rounded-xl border-2 border-[#0072CE] bg-blue-50/50 flex flex-col justify-between space-y-3 relative">
                    <span className="absolute -top-2.5 right-3 bg-[#0072CE] text-white text-[9px] font-extrabold px-2 py-0.5 rounded-full">BEST VALUE</span>
                    <div className="space-y-1">
                      <div className="font-extrabold text-sm text-slate-900">Full PRO Pass</div>
                      <div className="text-xl font-extrabold text-[#0072CE]">25.99 €</div>
                      <p className="text-[11px] text-slate-600">Questions + B1 Course + PPA Templates.</p>
                    </div>
                    <button onClick={() => { setSelectedPlan("full"); setShowPayModal(true); }} className="w-full py-2 bg-[#0072CE] text-white text-xs font-bold rounded-lg shadow">Get PRO</button>
                  </div>
                </div>

                <button onClick={() => { setQIdx(0); setScore(0); setPicked(null); setIsFinished(false); }} className="w-full py-2 border border-slate-300 text-slate-700 font-bold rounded-xl text-xs">Try Again 🔄</button>
              </div>
            </main>
          )}

          {showPayModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b pb-3">
                  <h3 className="font-extrabold text-lg">
                    {selectedPlan === "full" ? "Full PRO Pass (25.99 €)" : "Basic Pass (9.99 €)"}
                  </h3>
                  <button onClick={() => setShowPayModal(false)} className="font-bold">✕</button>
                </div>
                <div className="p-4 rounded-xl bg-blue-50 border flex justify-between items-center">
                  <div>
                    <div className="font-bold">Instant Access</div>
                    <div className="text-xs text-slate-600">90 days full access · Secure payment</div>
                  </div>
                  <div className="text-2xl font-extrabold text-[#0072CE]">
                    {selectedPlan === "full" ? "25.99 €" : "9.99 €"}
                  </div>
                </div>
                <a href="https://gumroad.com" target="_blank" rel="noreferrer" className="block text-center py-3.5 bg-[#0072CE] text-white font-bold rounded-xl shadow">Pay with Card / Apple Pay →</a>
                <div className="pt-2">
                  <input type="text" placeholder="Promo / License Key (e.g. ESTONIA2026)" onChange={(e)=>{if(e.target.value.toUpperCase()==="ESTONIA2026"){setIsPro(true);setShowPayModal(false);alert("PRO Unlocked!");}}} className="w-full px-3 py-2 border rounded-lg text-sm font-mono uppercase" />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
