                      onClick={() => idx === 0 ? setTab("practice") : setShowPayModal(true)}
                      className={`mt-8 w-full py-3.5 rounded-xl font-bold transition ${
                        idx === 2
                          ? "bg-[#0072CE] text-white hover:bg-blue-700"
                          : "bg-slate-900 text-white hover:bg-slate-800"
                      }`}
                    >
                      {p.btn}
                    </button>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* PAYMENT & LICENSE MODAL */}
          {showPayModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-5 shadow-2xl border border-slate-200">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-extrabold text-lg text-slate-900">
                    Põhiseadus Pass + Eesti Keel B1
                  </h3>
                  <button
                    onClick={() => setShowPayModal(false)}
                    className="text-slate-400 hover:text-slate-700 font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 rounded-xl bg-blue-50 border border-blue-200 flex items-center justify-between">
                  <div>
                    <div className="font-bold text-slate-900">90-päevane täispääse</div>
                    <div className="text-xs text-slate-600">Ühekordne makse · Kõik küsimused</div>
                  </div>
                  <div className="text-2xl font-extrabold text-[#0072CE]">29,99 €</div>
                </div>

                {/* Gumroad / Stripe Checkout Button */}
                <a
                  href="https://gumroad.com"
                  target="_blank"
                  rel="noreferrer"
                  className="block w-full text-center py-3.5 rounded-xl bg-[#0072CE] hover:bg-blue-700 text-white font-bold shadow-md transition"
                >
                  💳 Maksa kaardiga / Apple Pay (29,99 €) →
                </a>

                <div className="pt-3 border-t border-slate-200 space-y-2">
                  <label className="block text-xs font-bold text-slate-600 uppercase">
                    Sul on juba litsentsikood? (Testkood: ESTONIA2026)
                  </label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={licenseKey}
                      onChange={(e) => setLicenseKey(e.target.value)}
                      placeholder="ESTONIA2026"
                      className="flex-1 px-3 py-2 rounded-lg border border-slate-300 text-sm font-mono uppercase"
                    />
                    <button
                      onClick={activateLicense}
                      className="px-4 py-2 rounded-lg bg-slate-900 text-white text-xs font-bold"
                    >
                      Aktiveeri
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-8 mt-12">
            <div className="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
              <div>© 2026 Põhiseadus Pass · Eesti Kodakondsuse & Keele Eksam</div>
              <div>Ametlikud allikad: Riigi Teataja & HARNO</div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
